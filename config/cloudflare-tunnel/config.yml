# Cloudflare Tunnel for the local API. Copy this file to %USERPROFILE%\.cloudflared\config.yml and edit the placeholders.
# Full steps: config/cloudflare-tunnel/README.md
#
# The API keeps listening on 127.0.0.1 only. cloudflared dials out to Cloudflare from this PC, so no inbound port is
# opened. The API has NO login of its own: the Cloudflare Access application on the hostname below is the only thing
# protecting it. Create that Access application BEFORE running the tunnel.

tunnel: <your-tunnel-id>
# On Windows, if "~" is not expanded, write the full path: C:\Users\<you>\.cloudflared\<your-tunnel-id>.json
credentials-file: ~/.cloudflared/<your-tunnel-id>.json

ingress:
  - hostname: api.quantresearch.yourdomain.com
    # 127.0.0.1, not "localhost": on Windows "localhost" can resolve to IPv6 first, and the API listens on IPv4 only.
    service: http://127.0.0.1:8000
    originRequest:
      noTLSVerify: false
  # Anything else that reaches the tunnel gets a 404.
  - service: http_status:404
